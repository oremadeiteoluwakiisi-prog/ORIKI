<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Review your selected ORIKI fashion pieces in your shopping cart.">
    <title>Your Cart | ORIKI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="collection.css">
    <script src="currency.js" defer></script>
    <script src="cart.js" defer></script>
    <script src="main.js" defer></script>
    <script src="payment-config.js" defer></script>
    <script src="shop.js" defer></script>
</head>

<body>
    <header class="header header-light" id="header">
        <nav class="navbar">
            <a href="index.html" class="logo">ORIKI<span>.</span></a>
            <div class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="collection.html" class="nav-link">Collection</a>
                <a href="men.html" class="nav-link">Men</a>
                <a href="women.html" class="nav-link">Women</a>
                <a href="index.html#story" class="nav-link">Our Story</a>
            </div>
            <div class="nav-actions">
                <button class="currency-btn" id="currencyBtn" type="button">NGN ₦</button>
                <a href="shop.html" class="shop-btn" aria-current="page">Cart</a>
                <button class="menu-toggle" id="menuToggle" aria-label="Open navigation menu" aria-expanded="false"
                    aria-controls="navMenu" type="button">
                    <span></span>
                    <span></span>
                </button>
            </div>
        </nav>
    </header>

    <main class="cart-page">
        <section class="cart-header">
            <p class="section-label">YOUR SELECTION</p>
            <div>
                <h1>Shopping <span>Cart</span></h1>
                <p id="cartCount">0 ITEMS</p>
            </div>
        </section>

        <section class="cart-layout">
            <div class="cart-grid" id="cartGrid" aria-live="polite"></div>
            <aside class="cart-summary">
                <p>Order Summary</p>
                <div>
                    <span>Total</span>
                    <strong id="cartTotal">₦0</strong>
                </div>
                <p class="cart-payment-note">Paystack checkout charges in Nigerian naira. USD prices are indicative.</p>
                <label class="checkout-email-label" for="checkoutEmail">Email for your receipt</label>
                <input id="checkoutEmail" type="email" autocomplete="email" required
                    placeholder="you@example.com">
                <button id="checkoutButton" type="button">Pay securely with Paystack</button>
                <p id="checkoutStatus" class="checkout-status" role="status" aria-live="polite"></p>
            </aside>
        </section>
    </main>
</body>

</html>
